<style>

html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--bd);background:var(--cd);border-radius:8px;padding:7px 12px;transition:background .15s}button:hover{background:var(--zs)}

button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.f{display:block;font-size:12px;color:var(--mu);margin:10px 0 3px}

nav button{flex:1;min-width:0;border:0;background:none;font-size:10.5px;color:var(--mu);padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px}

@media(min-width:800px){body{padding-left:180px}nav{top:0;right:auto;width:180px;flex-direction:column;border:0;border-right:1px solid var(--bd);padding:calc(20px + env(safe-area-inset-top,0px)) 10px;gap:4px}nav button{flex:none;flex-direction:row;font-size:14px;gap:10px;padding:8px 10px;justify-content:flex-start}main{padding-bottom:40px}}
h1{font-size:22px;margin:4px 0 10px}h2{font-size:14px;margin:20px 0 8px;color:var(--mu);font-weight:600}
.cd{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:10px}
.g{cursor:pointer;transition:border-color .15s}.g:hover{border-color:var(--ac)}.g.nr{border-color:var(--wr);box-shadow:0 0 0 1px var(--wr)}
.row{display:flex;gap:8px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}.row b{min-width:0;overflow-wrap:anywhere;flex:1}
.m{color:var(--mu);font-size:12.5px;margin:4px 0 8px}

.p{background:var(--as);color:var(--ac)}.d{background:var(--os);color:var(--ok)}.o{background:var(--es);color:var(--er)}.z{background:var(--zs);color:var(--pz)}.n{background:var(--ws);color:var(--wr)}

.st{margin:0}.st b{display:block;font-size:26px}.st span{color:var(--mu);font-size:12.5px}
.q{display:flex;gap:6px;margin-top:10px;align-items:center;flex-wrap:wrap}.q input[type=number]{max-width:150px}
.mn{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.mi{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-top:1px solid var(--bd);cursor:pointer}.mi:first-child{border:0}.mi small{display:block;color:var(--mu)}
.fl{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.fl select{flex:1;min-width:130px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.cal small{color:var(--mu)}
.cal button{aspect-ratio:1;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.cal button.t{border-color:var(--ac)}.cal button.s{background:var(--as)}.cal u{width:6px;height:6px;border-radius:50%;background:var(--ac)}
.sw{position:relative;width:40px;height:22px;display:inline-block}.sw input{opacity:0;position:absolute;inset:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}

.sw span:after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:var(--cd);box-shadow:0 0 2px #0004;transition:.2s}
.sw input:checked+span{background:var(--ac)}.sw input:checked+span:after{transform:translateX(18px)}
dialog{border:1px solid var(--bd);border-radius:14px;background:var(--cd);color:var(--tx);width:min(480px,94vw);padding:0;max-height:90vh}dialog::backdrop{background:#0006}
#ts{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:10px;z-index:99;font-size:13px;max-width:90vw}
.sg{display:flex;gap:6px;margin-top:8px}.sg button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.sr{display:flex;gap:6px;align-items:center;margin:4px 0}
svg text{fill:var(--mu);font-size:9px}
.tk{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--bd)}.tk:first-child{border:0}.tk>div{flex:1;min-width:0;overflow-wrap:anywhere}.tk small{display:block;color:var(--mu);font-size:12px}.tk.dn span{text-decoration:line-through;color:var(--mu)}.tk input[type=checkbox]{width:18px;height:18px;flex:none}
.wd{display:flex;gap:6px;flex-wrap:wrap}.wd label{display:flex;align-items:center;gap:4px;border:1px solid var(--bd);border-radius:8px;padding:4px 8px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<nav><button data-a="nv" data-s="ov"><b>◎</b>Обзор</button><button data-a="nv" data-s="gl"><b>✓</b>Цели</button><button data-a="nv" data-s="tk"><b>☑</b>Задачи</button><button data-a="nv" data-s="cal"><b>▦</b>Календарь</button><button data-a="nv" data-s="rp"><b>✎</b>Отчёты</button><button data-a="nv" data-s="set"><b>⚙</b>Настройки</button></nav>
<main></main><dialog id="dlg"></dialog><div id="ts" hidden role="status"></div>
<script>
let K='pgd.v1';
const MN='Январь Февраль Март Апрель Май Июнь Июль Август Сентябрь Октябрь Ноябрь Декабрь'.split(' '),
CATS=['Работа и карьера','Финансы','Здоровье и спорт','Образование и развитие','Личная жизнь','Другое'],
PR={h:'Высокий',m:'Средний',l:'Низкий'},TY={num:'Числовая',steps:'Этапы',count:'Количество',simple:'Простая'},
SL={prog:['В процессе','p'],done:['Выполнена','d'],over:['Просрочена','o'],paused:['Приостановлена','z']};
const $=s=>document.querySelector(s),gi=id=>document.getElementById(id),pd=n=>String(n).padStart(2,'0'),
iso=d=>d.getFullYear()+'-'+pd(d.getMonth()+1)+'-'+pd(d.getDate()),TD=()=>iso(new Date()),
dn=s=>{const[y,m,d]=s.split('-');return Math.round(Date.UTC(y,m-1,d)/864e5)},fd=s=>s.split('-').reverse().join('.'),sd=s=>fd(s).slice(0,5),
nf=new Intl.NumberFormat('ru-RU'),cl=x=>Math.max(0,Math.min(100,x)),
esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),
uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6),
pl=n=>{n=Math.abs(n);const a=n%10,b=n%100;return n+' '+(a==1&&b!=11?'день':a>1&&a<5&&(b<12||b>14)?'дня':'дней')},
fm=(v,u)=>nf.format(v)+(u?'\u00a0'+u:''),ID=g=>`data-id="${esc(g.id)}"`,DRE=/^\d{4}-\d\d-\d\d$/;
function addD(s,n){const[y,m,d]=s.split('-').map(Number);return iso(new Date(y,m-1,d+n))}
function mon(s){const[y,m,d]=s.split('-').map(Number);return addD(s,-((new Date(y,m-1,d).getDay()+6)%7))}
let S,mem=0,cb,FO,tm,U={s:'ov',g:null,td:TD(),ym:TD().slice(0,7),f:{c:'',s:'',o:'end'},cd:TD(),wk:mon(TD())};
const D=$('#dlg'),mq=matchMedia('(prefers-color-scheme: dark)');
function toast(m){const e=$('#ts');e.textContent=m;e.hidden=false;clearTimeout(tm);tm=setTimeout(()=>e.hidden=true,4000)}
/* расчёты */
function pct(g){if(g.done)return 100;if(g.type==='steps'){const n=g.steps.length;return n?cl(g.steps.filter(s=>s.d).length/n*100):0}if(g.type==='simple')return g.cur?100:0;return g.target>0?cl(g.cur/g.target*100):0}
function st(g){if(g.paused)return'paused';if(pct(g)>=100)return'done';return dn(g.end)<dn(TD())?'over':'prog'}
const left=g=>dn(g.end)-dn(TD());
function tp(g){const a=dn(g.start),b=dn(g.end),t=dn(TD());return b<=a?(t>=b?100:0):cl((t-a)/(b-a)*100)}
const lag=g=>st(g)==='prog'&&pct(g)<tp(g)-10,near=g=>st(g)==='prog'&&left(g)>=0&&left(g)<=3;
const inM=(g,ym)=>{const[y,m]=ym.split('-');return g.start<=ym+'-'+pd(new Date(y,m,0).getDate())&&g.end>=ym+'-01'};
function lt(g){const n=left(g);return st(g)==='done'?'':n<0?'просрочено на '+pl(-n):n===0?'дедлайн сегодня':'осталось '+pl(n)}
function val(g){return g.type==='num'?fm(g.cur,g.unit)+' / '+fm(g.target,g.unit):g.type==='count'?nf.format(g.cur)+' / '+nf.format(g.target)+(g.unit?' '+g.unit:''):g.type==='steps'?g.steps.filter(s=>s.d).length+' / '+g.steps.length+' этапов':(pct(g)?'Выполнено':'Не выполнено')}
const rk=g=>st(g)==='over'?0:near(g)?1:lag(g)?2:3;
const why=g=>st(g)==='over'?lt(g):near(g)?'Дедлайн близко, '+lt(g):lag(g)?`Отстаёт: ${Math.round(pct(g))}% вместо ~${Math.round(tp(g))}%`:lt(g)+', до '+sd(g.end);
/* данные */
function ng(g){const n={title:'',cat:CATS[5],prio:'m',desired:'',desc:'',notes:'',unit:'',cur:0,target:1,steps:[],hist:[],done:false,paused:false,...g};n.id=String(n.id||uid());n.cur=Math.max(0,+n.cur||0);n.target=+n.target>0?+n.target:1;n.steps=(Array.isArray(n.steps)?n.steps:[]).map(s=>({t:String(s.t==null?'':s.t),d:!!s.d}));n.hist=(Array.isArray(n.hist)?n.hist:[]).filter(h=>h&&DRE.test(h.d)).map(h=>({d:h.d,p:cl(+h.p||0)}));n.done=!!n.done;n.paused=!!n.paused;if(!PR[n.prio])n.prio='m';return n}
const stp=(a,k)=>a.map((t,i)=>({t,d:i<k}));
const demo=()=>({v:1,theme:'auto',goals:[
{id:'d1',title:'Продать продукции Tasbaka на 2 000 000 ₸',cat:CATS[0],prio:'h',start:'2026-11-01',end:'2026-11-30',type:'num',unit:'₸',cur:600000,target:2000000,hist:[{d:'2026-11-01',p:0},{d:'2026-11-05',p:10},{d:'2026-11-10',p:30}]},
{id:'d2',title:'Создать базу общения с клиентами',cat:CATS[0],prio:'m',start:'2026-11-01',end:'2026-11-20',type:'steps',steps:stp(['Приветствие','Выявление потребностей','Презентация','Работа с возражениями','Закрытие сделки'],2),hist:[{d:'2026-11-01',p:0},{d:'2026-11-08',p:20},{d:'2026-11-10',p:40}]},
{id:'d3',title:'Создать полную систему работы менеджера',cat:CATS[0],prio:'m',start:'2026-11-05',end:'2026-11-30',type:'steps',steps:stp(['Описать воронку продаж','Составить скрипты и шаблоны','Настроить CRM','Внедрить отчётность и KPI','Обучить команду','Провести аудит и доработки'],1),hist:[{d:'2026-11-05',p:0},{d:'2026-11-09',p:17}]},
{id:'d4',title:'Купить межсезонную обувь за 20 000 ₸',cat:CATS[4],prio:'l',start:'2026-11-01',end:'2026-11-14',type:'simple',cur:0,hist:[{d:'2026-11-01',p:0}]},
{id:'d5',title:'Провести 8 тренировок за месяц',cat:CATS[2],prio:'m',start:'2026-11-01',end:'2026-11-30',type:'count',cur:3,target:8,hist:[{d:'2026-11-01',p:0},{d:'2026-11-06',p:13},{d:'2026-11-10',p:38}]}].map(ng),reports:[],tasks:DT()});
const ok=o=>o&&o.v===1&&Array.isArray(o.goals)&&Array.isArray(o.reports)&&o.goals.every(g=>g&&typeof g.title==='string'&&DRE.test(g.start)&&DRE.test(g.end)&&g.end>=g.start&&TY[g.type]);
function load(){try{const r=localStorage.getItem(K);if(r){const o=JSON.parse(r);if(ok(o))return o}}catch(e){}return null}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){if(!mem)toast('Хранилище недоступно — данные сохраняются только в памяти');mem=1}if(A){clearTimeout(pt);pt=setTimeout(()=>sync(0),800)}}
function rec(g){const p=Math.round(pct(g)),t=TD(),l=g.hist[g.hist.length-1];if(l&&l.d===t)l.p=p;else if(!l||l.p!==p)g.hist.push({d:t,p})}
function upd(g){rec(g);save();render()}
const gm=id=>S.goals.find(g=>g.id===id);
/* UI-блоки */
const hd=(t,x='')=>`<div class="row"><h1>${t}</h1><div class="sr">${x}<span class="sy m" style="margin:0" title="Состояние синхронизации">${SYS[SYK][0]}</span><button data-a="tt" title="Сменить тему" aria-label="Сменить тему">◐</button></div></div>`;
const bd=g=>`<span class="bg ${SL[st(g)][1]}">${SL[st(g)][0]}</span>`+(near(g)?' <span class="bg n">Дедлайн близко</span>':'');
const br=g=>{const s=st(g);return `<div class="bar"><i class="${s==='done'?'d':s==='over'?'o':''}" style="width:${pct(g)}%"></i></div>`};
const mn=()=>`<div class="mn"><button data-a="mp" aria-label="Предыдущий месяц">←</button><b>${MN[+U.ym.slice(5)-1]} ${U.ym.slice(0,4)}</b><button data-a="mx" aria-label="Следующий месяц">→</button></div>`;
function shm(d){let[y,m]=U.ym.split('-').map(Number);m+=d;if(m<1){m=12;y--}if(m>12){m=1;y++}U.ym=y+'-'+pd(m);U.cd=TD().slice(0,7)===U.ym?TD():U.ym+'-01'}
const mi=(g,r)=>`<div class="mi" data-a="open" ${ID(g)}><div><b>${esc(g.title)}</b><small>${r}</small></div><span class="bg ${SL[st(g)][1]}">${Math.round(pct(g))}%</span></div>`;
const L=(a,f)=>a.length?`<div class="cd">${a.map(f).join('')}</div>`:'<div class="cd m" style="margin-bottom:10px">Пока пусто</div>';
function qc(g){if(g.paused)return'';let h;
if(g.type==='num')h=`<input type="number" min="0" step="any" id="q${esc(g.id)}" placeholder="Сколько добавить"><button class="pr" data-a="add" ${ID(g)}>+</button>`;
else if(g.type==='count')h=`<button class="pr" data-a="inc" ${ID(g)}>+1</button>`;
else if(g.type==='simple')h=`<label class="sw" data-a="n"><input type="checkbox" data-a="sm" ${ID(g)} ${g.cur?'checked':''}><span></span></label><span class="m" style="margin:0">${g.cur?'Выполнено':'Отметить выполненной'}</span>`;
else h='<div style="width:100%">'+g.steps.map((s,k)=>`<label class="sr" data-a="n"><input type="checkbox" data-a="stp" ${ID(g)} data-k="${k}" ${s.d?'checked':''}> <span>${esc(s.t)}</span></label>`).join('')+'</div>';
return `<div class="q" data-a="n">${h}</div>`}
const card=g=>`<div class="cd g${near(g)?' nr':''}" data-a="open" ${ID(g)}><div class="row"><b>${esc(g.title)}</b><div style="text-align:right">${bd(g)}</div></div><div class="m">${g.cat} · ${PR[g.prio]} приоритет · до ${fd(g.end)}${st(g)==='done'?'':' · '+lt(g)}</div>${br(g)}<div class="row" style="margin-top:6px"><span class="m" style="margin:0">${val(g)}</span><b style="flex:none">${Math.round(pct(g))}%</b></div>${qc(g)}</div>`;
/* экраны */
function ov(){const gs=S.goals.filter(g=>inM(g,U.ym)),a=gs.filter(g=>!g.paused),c=k=>gs.filter(g=>st(g)===k).length,
avg=a.length?Math.round(a.reduce((s,g)=>s+pct(g),0)/a.length):0,op=a.filter(g=>st(g)!=='done'),
[Y,M]=U.ym.split('-').map(Number),ms=dn(U.ym+'-01'),me=dn(U.ym+'-'+pd(new Date(Y,M,0).getDate())),el=Math.round(cl((dn(TD())-ms+1)/(me-ms+1)*100)),
byE=(x,y)=>x.end.localeCompare(y.end),dl=[...op].sort(byE).slice(0,3),lg=op.filter(lag),nx=[...op].sort((x,y)=>rk(x)-rk(y)||byE(x,y)).slice(0,3);
const S4=[['Активные',c('prog')],['Выполненные',c('done')],['Просроченные',c('over')],['Общий прогресс',avg+'%']];
return hd('Обзор')+mn()+(gs.length?`<div class="grid">${S4.map(([t,n])=>`<div class="cd st"><b>${n}</b><span>${t}</span></div>`).join('')}</div>
${tdc()}<div class="cd"><div class="row"><b>Шкала месяца</b><span class="m" style="margin:0">выполнено ${avg}% · прошло ${el}% времени</span></div><div class="bar" style="margin-top:8px"><i style="width:${avg}%"></i></div><div class="bar" style="height:4px;margin-top:8px"><i style="background:var(--mu);width:${el}%"></i></div></div>
<h2>Что делать дальше</h2>${nx.length?L(nx,g=>mi(g,why(g))):'<div class="cd m">Все цели месяца выполнены или на паузе.</div>'}
<h2>Ближайшие дедлайны</h2>${L(dl,g=>mi(g,'до '+sd(g.end)+' · '+lt(g)))}
<h2>Отстают от темпа</h2>${lg.length?L(lg,g=>mi(g,`Выполнено ${Math.round(pct(g))}%, по времени прошло ${Math.round(tp(g))}%`)):'<div class="cd m">Отстающих нет — вы идёте по плану.</div>'}`
:`<div class="cd m">В этом месяце целей нет.<div class="q"><button class="pr" data-a="new">+ Добавить цель</button></div></div>`)}
